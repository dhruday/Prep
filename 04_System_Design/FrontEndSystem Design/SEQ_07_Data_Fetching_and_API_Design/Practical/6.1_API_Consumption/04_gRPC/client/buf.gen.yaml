# ─────────────────────────────────────────────────────────────────────────────
# buf.gen.yaml — Code generation config (place in client/)
#
# Run from the client/ directory:
#   npm run generate          (uses npx buf under the hood)
#
# What it does:
#   1. protoc-gen-es        → generates TypeScript message classes (user_pb.ts)
#                             from the .proto definitions.
#   2. protoc-gen-connect-es → generates TypeScript service descriptors
#                             (user_connect.ts) consumed by @connectrpc/connect.
#
# Pre-generated files are included in src/generated/ so you can run the lab
# immediately without this step. Use it to practice the codegen pipeline.
#
# Breaking change detection (run from project root):
#   npx buf breaking proto/ --against proto/.git#branch=main
#   This is the CI guard that prevents proto changes from silently breaking
#   deployed browser clients. FAANG interview talking point!
# ─────────────────────────────────────────────────────────────────────────────

version: v2

inputs:
  - directory: ../proto   # points at 04_gRPC/proto/

plugins:
  # Generates: src/generated/user_pb.ts  (message classes + enums)
  - local: protoc-gen-es
    out: src/generated
    opt: target=ts

  # Generates: src/generated/user_connect.ts  (service descriptor)
  - local: protoc-gen-connect-es
    out: src/generated
    opt: target=ts

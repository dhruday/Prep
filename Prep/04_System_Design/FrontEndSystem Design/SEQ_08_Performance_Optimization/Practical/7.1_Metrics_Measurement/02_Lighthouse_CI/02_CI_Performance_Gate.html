<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CI Performance Gate Simulator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#0f1117;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;padding:24px;line-height:1.7}h1{font-size:1.4rem;color:#f59e0b;margin-bottom:4px}.sub{color:#94a3b8;font-size:.82rem;margin-bottom:16px}.card{background:#1e2130;border:1px solid #2d3551;border-radius:12px;padding:20px;margin-bottom:14px}.card h3{color:#f59e0b;margin-bottom:8px;font-size:.95rem}button{background:#f59e0b;color:#0f1117;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:600;font-size:.82rem;margin:4px}button:hover{opacity:.85}label{font-size:.82rem;color:#94a3b8;display:block;margin:4px 0 2px}input[type=range]{width:200px;accent-color:#f59e0b}.metric-row{display:flex;align-items:center;gap:12px;margin:6px 0;font-size:.82rem;flex-wrap:wrap}.pass{color:#10b981}.fail{color:#ef4444}.ci-output{background:#0f1117;border:1px solid #2d3551;border-radius:8px;padding:16px;font-family:monospace;font-size:.78rem;line-height:1.8;margin:10px 0;white-space:pre-wrap}
</style>
</head>
<body>
<h1>CI Performance Gate Simulator</h1>
<p class="sub">Practical 7.1 · Simulate a CI pipeline that passes/fails based on performance budgets</p>

<div class="card">
  <h3>Simulated PR Metrics</h3>
  <p style="font-size:.82rem;color:#94a3b8;margin-bottom:8px">Adjust the metrics to see if the CI gate passes or fails.</p>
  <div class="metric-row">
    <label style="width:130px">LCP:</label>
    <input type="range" id="s-lcp" min="500" max="6000" step="100" value="2200" oninput="runCI()">
    <span id="s-lcp-v" style="width:60px">2200ms</span>
    <span id="s-lcp-r">Budget: ≤2500ms</span>
  </div>
  <div class="metric-row">
    <label style="width:130px">CLS:</label>
    <input type="range" id="s-cls" min="0" max="0.5" step="0.01" value="0.05" oninput="runCI()">
    <span id="s-cls-v" style="width:60px">0.05</span>
    <span id="s-cls-r">Budget: ≤0.10</span>
  </div>
  <div class="metric-row">
    <label style="width:130px">JS Bundle (KB):</label>
    <input type="range" id="s-js" min="50" max="500" step="10" value="150" oninput="runCI()">
    <span id="s-js-v" style="width:60px">150KB</span>
    <span id="s-js-r">Budget: ≤170KB</span>
  </div>
  <div class="metric-row">
    <label style="width:130px">Lighthouse Score:</label>
    <input type="range" id="s-perf" min="0" max="100" value="92" oninput="runCI()">
    <span id="s-perf-v" style="width:60px">92</span>
    <span id="s-perf-r">Budget: ≥90</span>
  </div>
</div>

<div class="card">
  <h3>CI Pipeline Output</h3>
  <div class="ci-output" id="ci-output"></div>
</div>

<script>
const budgets = { lcp: 2500, cls: 0.1, js: 170, perf: 90 };

function runCI() {
  const vals = {
    lcp: +document.getElementById('s-lcp').value,
    cls: +document.getElementById('s-cls').value,
    js: +document.getElementById('s-js').value,
    perf: +document.getElementById('s-perf').value,
  };

  document.getElementById('s-lcp-v').textContent = vals.lcp + 'ms';
  document.getElementById('s-cls-v').textContent = vals.cls.toFixed(2);
  document.getElementById('s-js-v').textContent = vals.js + 'KB';
  document.getElementById('s-perf-v').textContent = vals.perf;

  const checks = [
    { name: 'LCP', actual: vals.lcp, budget: budgets.lcp, unit: 'ms', pass: vals.lcp <= budgets.lcp },
    { name: 'CLS', actual: vals.cls.toFixed(2), budget: budgets.cls, unit: '', pass: vals.cls <= budgets.cls },
    { name: 'JS Bundle', actual: vals.js, budget: budgets.js, unit: 'KB', pass: vals.js <= budgets.js },
    { name: 'Lighthouse', actual: vals.perf, budget: budgets.perf, unit: '', pass: vals.perf >= budgets.perf },
  ];

  // Update inline ratings
  ['lcp','cls','js','perf'].forEach((k, i) => {
    const el = document.getElementById(`s-${k}-r`);
    el.className = checks[i].pass ? 'pass' : 'fail';
    el.textContent = (checks[i].pass ? '✓ ' : '✗ ') + `Budget: ${k === 'perf' ? '≥' : '≤'}${budgets[k]}${checks[i].unit}`;
  });

  const allPass = checks.every(c => c.pass);
  let output = `<span style="color:#94a3b8">$ lhci autorun</span>\n`;
  output += `<span style="color:#94a3b8">Running Lighthouse CI...</span>\n\n`;

  checks.forEach(c => {
    const icon = c.pass ? '<span style="color:#10b981">✓ PASS</span>' : '<span style="color:#ef4444">✗ FAIL</span>';
    const delta = c.name === 'Lighthouse' ?
      `(${c.actual >= c.budget ? '+' : ''}${c.actual - c.budget})` :
      `(${c.actual <= c.budget ? '' : '+'}${(c.actual - c.budget).toFixed ? (c.actual - c.budget).toFixed(c.name === 'CLS' ? 2 : 0) : c.actual - c.budget}${c.unit})`;
    output += `  ${icon}  ${c.name}: ${c.actual}${c.unit} ${delta}\n`;
  });

  output += `\n`;
  if (allPass) {
    output += `<span style="color:#10b981;font-weight:700">✓ All performance budgets passed!</span>\n`;
    output += `<span style="color:#10b981">PR check: PASSED — ready to merge</span>`;
  } else {
    const failures = checks.filter(c => !c.pass).map(c => c.name).join(', ');
    output += `<span style="color:#ef4444;font-weight:700">✗ Performance budget exceeded: ${failures}</span>\n`;
    output += `<span style="color:#ef4444">PR check: FAILED — fix performance regressions before merging</span>`;
  }

  document.getElementById('ci-output').innerHTML = output;
}

runCI();
</script>
</body>
</html>

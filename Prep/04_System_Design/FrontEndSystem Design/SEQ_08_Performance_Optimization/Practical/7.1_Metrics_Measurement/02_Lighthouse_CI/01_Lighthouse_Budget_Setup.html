<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Lighthouse Budget Setup</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#0f1117;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;padding:24px;line-height:1.7}h1{font-size:1.4rem;color:#f59e0b;margin-bottom:4px}.sub{color:#94a3b8;font-size:.82rem;margin-bottom:16px}.card{background:#1e2130;border:1px solid #2d3551;border-radius:12px;padding:20px;margin-bottom:14px}.card h3{color:#f59e0b;margin-bottom:8px;font-size:.95rem}pre{background:#0f1117;border:1px solid #2d3551;border-radius:8px;padding:14px;overflow-x:auto;font-size:.78rem;line-height:1.6;margin:8px 0;white-space:pre-wrap}button{background:#f59e0b;color:#0f1117;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:600;font-size:.82rem;margin:4px}button:hover{opacity:.85}label{font-size:.82rem;color:#94a3b8;display:block;margin:6px 0 2px}input[type=range]{width:100%;accent-color:#f59e0b}input[type=number]{background:#0f1117;border:1px solid #2d3551;color:#e2e8f0;padding:4px 8px;border-radius:4px;width:80px;font-size:.82rem}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<h1>Lighthouse Budget Setup</h1>
<p class="sub">Practical 7.1 · Build a lighthouserc.js configuration interactively</p>

<div class="card">
  <h3>Configure Performance Budgets</h3>
  <label>Performance Score Minimum</label>
  <div class="row"><input type="range" id="perf" min="0" max="100" value="90" oninput="update()"><span id="perf-val">90</span></div>
  <label>LCP Maximum (ms)</label>
  <div class="row"><input type="range" id="lcp" min="500" max="8000" step="100" value="2500" oninput="update()"><span id="lcp-val">2500</span></div>
  <label>CLS Maximum</label>
  <div class="row"><input type="range" id="cls" min="0" max="0.5" step="0.01" value="0.1" oninput="update()"><span id="cls-val">0.10</span></div>
  <label>TTI Maximum (ms)</label>
  <div class="row"><input type="range" id="tti" min="1000" max="15000" step="500" value="5000" oninput="update()"><span id="tti-val">5000</span></div>
  <label>Total Byte Weight Maximum (KB)</label>
  <div class="row"><input type="range" id="bytes" min="100" max="2000" step="50" value="500" oninput="update()"><span id="bytes-val">500</span></div>
  <label>JS Bundle Maximum (KB gzipped)</label>
  <div class="row"><input type="range" id="js" min="50" max="500" step="10" value="170" oninput="update()"><span id="js-val">170</span></div>
</div>

<div class="card">
  <h3>Generated lighthouserc.js</h3>
  <button onclick="copyConfig()">📋 Copy Config</button>
  <pre id="config-output"></pre>
</div>

<div class="card">
  <h3>Generated budget.json</h3>
  <pre id="budget-output"></pre>
</div>

<script>
function update() {
  const vals = {
    perf: +document.getElementById('perf').value,
    lcp: +document.getElementById('lcp').value,
    cls: +document.getElementById('cls').value,
    tti: +document.getElementById('tti').value,
    bytes: +document.getElementById('bytes').value,
    js: +document.getElementById('js').value,
  };

  document.getElementById('perf-val').textContent = vals.perf;
  document.getElementById('lcp-val').textContent = vals.lcp;
  document.getElementById('cls-val').textContent = vals.cls.toFixed(2);
  document.getElementById('tti-val').textContent = vals.tti;
  document.getElementById('bytes-val').textContent = vals.bytes;
  document.getElementById('js-val').textContent = vals.js;

  document.getElementById('config-output').textContent = `// lighthouserc.js
module.exports = {
  ci: {
    collect: {
      url: ['http://localhost:3000/'],
      numberOfRuns: 3,
      settings: {
        preset: 'desktop', // or 'perf' for mobile throttling
      },
    },
    assert: {
      assertions: {
        'categories:performance': ['error', { minScore: ${vals.perf / 100} }],
        'first-contentful-paint': ['warn', { maxNumericValue: ${vals.lcp - 500} }],
        'largest-contentful-paint': ['error', { maxNumericValue: ${vals.lcp} }],
        'cumulative-layout-shift': ['error', { maxNumericValue: ${vals.cls} }],
        'interactive': ['error', { maxNumericValue: ${vals.tti} }],
        'total-byte-weight': ['error', { maxNumericValue: ${vals.bytes * 1000} }],
        'resource-summary:script:size': ['error', { maxNumericValue: ${vals.js * 1000} }],
      },
    },
    upload: {
      target: 'temporary-public-storage',
    },
  },
};`;

  document.getElementById('budget-output').textContent = JSON.stringify([{
    path: '/*',
    timings: [
      { metric: 'largest-contentful-paint', budget: vals.lcp },
      { metric: 'cumulative-layout-shift', budget: vals.cls },
      { metric: 'interactive', budget: vals.tti },
    ],
    resourceSizes: [
      { resourceType: 'total', budget: vals.bytes },
      { resourceType: 'script', budget: vals.js },
    ],
  }], null, 2);
}

function copyConfig() {
  navigator.clipboard?.writeText(document.getElementById('config-output').textContent)
    .then(() => alert('Copied!'));
}

update();
</script>
</body>
</html>

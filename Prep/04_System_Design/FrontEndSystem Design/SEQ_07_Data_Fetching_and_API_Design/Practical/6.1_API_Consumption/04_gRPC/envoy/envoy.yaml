# ─────────────────────────────────────────────────────────────────────────────
# Envoy proxy — gRPC-Web → gRPC translation
#
# ARCHITECTURE:
#   Browser (gRPC-Web)  ──HTTP/1.1 or HTTP/2──▶  Envoy :8080
#                                                        │
#                                    grpc_web filter +   │  HTTP/2 (native gRPC)
#                                    cors filter         │
#                                                        ▼
#                                              gRPC server :50051
#
# WHY ENVOY IS REQUIRED:
#   The browser's fetch() API cannot send raw HTTP/2 frames or use gRPC's
#   binary framing directly. Envoy bridges "gRPC-Web" (browser-compatible
#   request encoding) to native gRPC over HTTP/2.
#
# TWO FILTERS DOING THE HEAVY LIFTING:
#   1. envoy.filters.http.grpc_web  — strips gRPC-Web framing, adds gRPC trailers
#   2. envoy.filters.http.cors      — inserts CORS headers so the browser allows
#                                     the cross-origin binary POST requests
#
# Envoy admin UI: http://localhost:9901
# ─────────────────────────────────────────────────────────────────────────────

static_resources:

  listeners:
    - name: grpc_web_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080

      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager

                codec_type: auto
                stat_prefix: ingress_grpc_web

                # Access log to stdout (visible via `docker compose logs envoy`)
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog

                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: grpc_backend
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: user_grpc_service
                            # 0s = no timeout (streaming connections must not be killed)
                            timeout: 0s
                            max_stream_duration:
                              grpc_timeout_header_max: 0s

                      # ── CORS policy ─────────────────────────────────────────
                      # gRPC-Web requires these headers to be present. Without
                      # grpc-timeout and x-grpc-web, the browser preflight fails.
                      cors:
                        allow_origin_string_match:
                          - prefix: "*"
                        allow_methods: GET, PUT, DELETE, POST, OPTIONS
                        allow_headers: >-
                          keep-alive,user-agent,cache-control,content-type,
                          content-transfer-encoding,x-accept-content-transfer-encoding,
                          x-accept-response-streaming,x-user-agent,x-grpc-web,
                          grpc-timeout,authorization
                        max_age: "1728000"
                        expose_headers: grpc-status,grpc-message,grpc-status-details-bin

                # ── HTTP filter chain ──────────────────────────────────────────
                # ORDER MATTERS:
                #   grpc_web → cors → router
                #   (grpc_web must come before router or gRPC trailers get lost)
                http_filters:
                  - name: envoy.filters.http.grpc_web
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb

                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy

                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  # ── Upstream cluster: native gRPC server ──────────────────────────────────
  clusters:
    - name: user_grpc_service
      connect_timeout: 30s
      type: logical_dns
      dns_lookup_family: V4_ONLY
      lb_policy: round_robin

      # Tell Envoy to use HTTP/2 to talk to the backend (required for gRPC)
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}

      load_assignment:
        cluster_name: user_grpc_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      # "server" resolves via Docker Compose internal DNS
                      address: server
                      port_value: 50051

# ── Admin interface ───────────────────────────────────────────────────────────
# Visit http://localhost:9901/stats  to see gRPC request counters
# Visit http://localhost:9901/config_dump  for the full Envoy config
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

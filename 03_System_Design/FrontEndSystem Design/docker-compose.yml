version: '3.9'

services:
  # ─────────────────────────────────────────────────────────────────────────
  # SEQ_07: Data Fetching & API Design Server (Port 4001)
  # ─────────────────────────────────────────────────────────────────────────
  seq07-server:
    container_name: seq07-data-fetching-server
    build:
      context: ./SEQ_07_Data_Fetching_and_API_Design/Practical/server
      dockerfile: Dockerfile
    ports:
      - "4001:4001"
    environment:
      - NODE_ENV=development
      - PORT=4001
    volumes:
      - ./SEQ_07_Data_Fetching_and_API_Design/Practical:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - faang-prep

  # ─────────────────────────────────────────────────────────────────────────
  # SEQ_13: Frontend Security Server (Port 3001 + Attacker 3002)
  # ─────────────────────────────────────────────────────────────────────────
  seq13-server:
    container_name: seq13-security-server
    build:
      context: ./SEQ_13_Security/Practical/server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - ATTACKER_PORT=3002
    volumes:
      - ./SEQ_13_Security/Practical:/app
    depends_on:
      seq13-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - faang-prep

  # ─────────────────────────────────────────────────────────────────────────
  # Redis: Session & Token Store for SEQ_13
  # ─────────────────────────────────────────────────────────────────────────
  seq13-redis:
    container_name: seq13-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - faang-prep
    volumes:
      - redis-data:/data

networks:
  faang-prep:
    driver: bridge

volumes:
  redis-data:
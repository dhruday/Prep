# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml — gRPC-Web Lab Stack
#
# Services:
#   server  — Node.js gRPC server  (internal :50051, not exposed to host)
#   envoy   — Envoy proxy          (host :8080 → server :50051)
#
# Ports summary:
#   localhost:8080  → Envoy gRPC-Web endpoint  (what the browser connects to)
#   localhost:9901  → Envoy admin / stats UI
#   50051           → gRPC server (Docker-internal only; not exposed outside)
#
# Usage:
#   docker compose up --build        # first run
#   docker compose up                # subsequent runs
#   docker compose logs -f server    # server logs
#   docker compose logs -f envoy     # Envoy access logs
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── gRPC UserService (Node.js + TypeScript) ─────────────────────────────────
  server:
    build:
      # Context is 04_gRPC/ so the Dockerfile can access proto/ alongside server/
      context: .
      dockerfile: server/Dockerfile
    container_name: grpc_user_server
    # Only reachable within the Docker network by other services (Envoy)
    expose:
      - "50051"
    environment:
      - PORT=50051
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('@grpc/grpc-js')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Envoy Proxy (gRPC-Web ↔ gRPC HTTP/2 translation) ────────────────────────
  envoy:
    image: envoyproxy/envoy:v1.31-latest
    container_name: grpc_envoy_proxy
    ports:
      - "8080:8080"   # gRPC-Web endpoint  ← browser sends requests here
      - "9901:9901"   # Envoy admin UI
    volumes:
      # Mount config read-only; edit envoy/envoy.yaml and restart to apply
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    command: ["/usr/local/bin/envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    depends_on:
      server:
        condition: service_healthy

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-video-archiver"
version = "0.1.0"
description = "Authorized Telegram video archive downloader and organizer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Telethon>=1.36,<2",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
telegram-video-archiver = "app.cli:main"

[tool.setuptools]
packages = ["app"]

[tool.unittest]
start-directory = "tests"
